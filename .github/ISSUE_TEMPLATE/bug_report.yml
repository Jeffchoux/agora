name: Bug report
description: Help us reproduce a problem without sharing secrets.
title: "[Bug] "
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, AGORA commit, adapter and relevant CLI version. No credentials.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a minimal example without private project data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed keys, tokens, subscription sessions and private project content.
          required: true
